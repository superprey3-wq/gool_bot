name: one-shot-365scores
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-365scores.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe 365Scores
        run: |
          python - <<'PY' > scores365_probe_result.txt
          import json, urllib.request, urllib.parse
          BASE='https://webws.365scores.com/web'
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137 Safari/537.36','Accept':'*/*','Referer':'https://www.365scores.com/'}
          def get(path,params=None):
              q='?'+urllib.parse.urlencode(params or {}) if params else ''
              req=urllib.request.Request(BASE+'/'+path.lstrip('/')+q,headers=H)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:return r.status,json.loads(r.read().decode('utf-8'))
              except Exception as e:return 0,{'error':repr(e)}
          common={'appTypeId':5,'langId':1,'timezoneName':'Etc/UTC'}
          live=[]
          for path,extra in [('games/',{'sports':1,'showOdds':True}),('games/live/',{'sports':1,'showOdds':True}),('games/results/',{'sports':1,'showOdds':True})]:
              p=dict(common);p.update(extra); c,d=get(path,p)
              print('LIST',path,'HTTP',c,'ERROR',d.get('error') if isinstance(d,dict) else None)
              games=(d.get('games') or []) if isinstance(d,dict) else []
              print('COUNT',len(games))
              live=[g for g in games if g.get('statusGroup')==3]
              if live:break
          print('LIVE_FOUND',len(live))
          for i,g in enumerate(live[:10]):
              print('LIVE',i+1,'ID',g.get('id'),'HOME',(g.get('homeCompetitor') or {}).get('name'),'AWAY',(g.get('awayCompetitor') or {}).get('name'),'SCORE',(g.get('homeCompetitor') or {}).get('score'),'-',(g.get('awayCompetitor') or {}).get('score'))
              oddkeys=[k for k in g if any(x in k.lower() for x in ('odd','book','market','bet'))]
              print('LIST_ODD_KEYS',oddkeys)
          for g in live[:5]:
              gid=g.get('id'); print('\nGAME',gid)
              p=dict(common);p.update({'gameId':gid,'topBookmaker':14,'showOdds':True})
              c,d=get('game/',p); print('GAME_HTTP',c,'ERROR',d.get('error') if isinstance(d,dict) else None)
              game=(d.get('game') or {}) if isinstance(d,dict) else {}
              print('GAME_KEYS',list(game)[:100])
              hits=[]
              def walk(o,path=''):
                  if len(hits)>100:return
                  if isinstance(o,dict):
                      for k,v in o.items():
                          np=f'{path}.{k}' if path else k
                          if any(x in k.lower() for x in ('odd','bookmaker','market','betting')):hits.append((np,str(v)[:350]))
                          walk(v,np)
                  elif isinstance(o,list):
                      for j,v in enumerate(o[:60]):walk(v,f'{path}[{j}]')
              walk(game)
              print('ODDS_HITS',json.dumps(hits[:80],ensure_ascii=False))
              shots=((game.get('chartEvents') or {}).get('events') or [])
              print('SHOTS_N',len(shots),'SHOTS_SAMPLE',json.dumps(shots[:3],ensure_ascii=False)[:2200])
              events=game.get('events') or []
              reds=[e for e in events if ((e.get('eventType') or {}).get('id')==3)]
              print('EVENTS_N',len(events),'REDS_N',len(reds))
              p2=dict(common);p2.update({'gameId':gid})
              sc,sd=get('game/stats/',p2); print('STATS_HTTP',sc,'STATS_KEYS',list(sd)[:40] if isinstance(sd,dict) else type(sd))
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scores365_probe_result.txt
          git commit -m 'Store one-shot 365Scores probe result' || exit 0
          git push
