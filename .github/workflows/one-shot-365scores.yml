name: one-shot-365scores
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-365scores.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe 365Scores stats and odds endpoints
        run: |
          python - <<'PY' > scores365_probe_result.txt
          import json, urllib.request, urllib.parse
          BASE='https://webws.365scores.com/web'
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137 Safari/537.36','Accept':'*/*','Referer':'https://www.365scores.com/'}
          def get(path,params=None):
              q='?'+urllib.parse.urlencode(params or {}) if params else ''
              req=urllib.request.Request(BASE+'/'+path.lstrip('/')+q,headers=H)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read().decode('utf-8');
                      try:return r.status,json.loads(raw)
                      except:return r.status,{'raw':raw[:1200]}
              except Exception as e:return 0,{'error':repr(e)}
          common={'appTypeId':5,'langId':1,'timezoneName':'Etc/UTC','userCountryId':-1}
          p=dict(common);p.update({'sports':1,'showOdds':True})
          c,d=get('games/',p); games=(d.get('games') or []) if isinstance(d,dict) else []
          live=[g for g in games if g.get('statusGroup')==3]
          print('GAMES_HTTP',c,'ALL',len(games),'LIVE',len(live))
          for i,g in enumerate(live[:10]):
              print('LIVE',i+1,g.get('id'),(g.get('homeCompetitor') or {}).get('name'),'-',(g.get('awayCompetitor') or {}).get('name'),'score',(g.get('homeCompetitor') or {}).get('score'),(g.get('awayCompetitor') or {}).get('score'),'lineTypesIds',g.get('lineTypesIds'),'hasBetsTeaser',g.get('hasBetsTeaser'))
          targets=live[:3]
          # prefer a game with shot chart if possible
          for g in live:
              if g.get('hasShotChart'):
                  targets=[g]+[x for x in targets if x.get('id')!=g.get('id')][:2];break
          for g in targets:
              gid=g.get('id'); print('\nGAME',gid,(g.get('homeCompetitor') or {}).get('name'),'-',(g.get('awayCompetitor') or {}).get('name'))
              gp=dict(common);gp.update({'gameId':gid,'topBookmaker':14,'showOdds':True})
              gc,gd=get('game/',gp); game=(gd.get('game') or {}) if isinstance(gd,dict) else {}
              print('GAME_HTTP',gc,'KEYS',list(game)[:100])
              print('LINE_TYPES',game.get('lineTypesIds'),'BET_TEASER',game.get('hasBetsTeaser'))
              print('HOME_STATS',json.dumps((game.get('homeCompetitor') or {}).get('statistics') or [],ensure_ascii=False)[:2500])
              print('AWAY_STATS',json.dumps((game.get('awayCompetitor') or {}).get('statistics') or [],ensure_ascii=False)[:2500])
              shots=((game.get('chartEvents') or {}).get('events') or [])
              print('SHOTS_N',len(shots),'SHOTS_SAMPLE',json.dumps(shots[:3],ensure_ascii=False)[:2200])
              events=game.get('events') or []; reds=[e for e in events if ((e.get('eventType') or {}).get('id')==3)]
              print('EVENTS_N',len(events),'REDS_N',len(reds),'REDS',json.dumps(reds[:3],ensure_ascii=False)[:1500])
              sp=dict(common);sp.update({'games':gid})
              sc,sd=get('game/stats/',sp)
              print('STATS_HTTP',sc,'ERROR',sd.get('error') if isinstance(sd,dict) else None,'KEYS',list(sd)[:30] if isinstance(sd,dict) else type(sd))
              if sc==200: print('STATS_SAMPLE',json.dumps(sd,ensure_ascii=False)[:5000])
              # probe likely dedicated betting endpoints; no auth, one game only
              for path in ('game/odds/','game/bets/','game/betting/','odds/','bets/','games/odds/'):
                  oc,od=get(path,gp)
                  print('ODDS_PROBE',path,'HTTP',oc,'KEYS',list(od)[:30] if isinstance(od,dict) else type(od),'ERR',od.get('error') if isinstance(od,dict) else None)
                  if oc==200: print('ODDS_BODY',path,json.dumps(od,ensure_ascii=False)[:4000])
              break
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scores365_probe_result.txt
          git commit -m 'Update one-shot 365Scores probe result' || exit 0
          git push
