name: goal-api-one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/goal-api-one-shot.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe GOAL API odds entitlement
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: |
          python - <<'PY' > goal_probe_result.txt
          import os,json,urllib.request,urllib.error
          key=os.environ.get('GOAL_API_KEY',''); base='https://api.goal-api.com/v1'
          H={'Authorization':f'Bearer {key}','Accept':'application/json','User-Agent':'GOOL-probe/1.0'}
          def get(path):
              req=urllib.request.Request(base+path,headers=H)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:return e.code,{'error_body':e.read().decode('utf-8','ignore')[:1200]}
              except Exception as e:return 0,{'error':repr(e)}
          print('GOAL API ODDS ENTITLEMENT PROBE')
          c,d=get('/fixtures/live'); print('LIVE',c,'count',len(d.get('data') or []) if c==200 else d)
          rows=d.get('data') or [] if c==200 else []
          c2,d2=get('/odds/bookmakers'); print('BOOKMAKERS_HTTP',c2,json.dumps(d2,ensure_ascii=False)[:2500])
          for m in rows[:3]:
              fid=m.get('id') or m.get('fixtureId') or m.get('matchId')
              home=(m.get('homeTeam') or {}).get('name') if isinstance(m.get('homeTeam'),dict) else '?'
              away=(m.get('awayTeam') or {}).get('name') if isinstance(m.get('awayTeam'),dict) else '?'
              print('\nMATCH',fid,home,'-',away)
              a,b=get(f'/fixtures/{fid}/odds'); print('PREMATCH_ODDS_HTTP',a,json.dumps(b,ensure_ascii=False)[:2500])
              a,b=get(f'/fixtures/{fid}/live-odds'); print('LIVE_ODDS_HTTP',a,json.dumps(b,ensure_ascii=False)[:2500])
          PY
      - name: Commit probe result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add goal_probe_result.txt
          git commit -m "Update GOAL API odds probe result" || exit 0
          git push
