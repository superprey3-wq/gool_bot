name: one-shot-odds-sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-odds-sources.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests -q
      - name: Probe free live odds sources
        run: |
          python - <<'PY' > odds_sources_probe.txt
          import requests, json
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137 Safari/537.36','Accept':'application/json,text/plain,*/*'}
          def req(url,params=None,headers=None):
              try:
                  r=requests.get(url,params=params,headers=headers or H,timeout=20,allow_redirects=True)
                  print('HTTP',r.status_code,'URL',r.url,'LEN',len(r.content))
                  if r.status_code==200:
                      try:return r.json()
                      except Exception: print('NONJSON',r.text[:300])
              except Exception as e: print('ERR',type(e).__name__,e)
              return None
          print('=== 1XBET ===')
          root='https://1xbet.com/service-api/LiveFeed'
          d=req(root+'/Get1x2_VZip',{'sports':1,'count':1000,'lng':'en','mode':4,'country':1,'getEmpty':'true'},{**H,'Referer':'https://1xbet.com/','Origin':'https://1xbet.com'})
          events=(d or {}).get('Value') if isinstance(d,dict) else []
          events=events if isinstance(events,list) else []
          print('LIVE_EVENTS',len(events))
          for e in events[:5]: print('EVENT',e.get('I'),e.get('O1') or e.get('O1E'),'-',e.get('O2') or e.get('O2E'),'L',e.get('L') or e.get('LE'))
          for e in events[:3]:
              gid=e.get('I'); g=req(root+'/GetGameZip',{'id':gid,'lng':'en','cfview':0,'isSubGames':'true','GroupEvents':'true','allEventsGroupSubGames':'true','countevents':250,'grMode':2},{**H,'Referer':'https://1xbet.com/','Origin':'https://1xbet.com'})
              v=(g or {}).get('Value') if isinstance(g,dict) else None; nodes=[]
              def walk(o):
                  if isinstance(o,dict):
                      if 'C' in o and ('T' in o or 'P' in o):
                          try:
                              if float(o.get('C') or 0)>1:nodes.append({k:o.get(k) for k in ('T','C','P','G','N') if k in o})
                          except: pass
                      for x in o.values(): walk(x)
                  elif isinstance(o,list):
                      for x in o: walk(x)
              walk(v); tots=[n for n in nodes if n.get('T') in (9,10)]
              print('GAME',gid,'BET_NODES',len(nodes),'FT_TOTALS',tots[:12])
          print('\n=== BOVADA ===')
          b=req('https://www.bovada.lv/services/sports/event/v2/events/A/description/soccer',{'lang':'en','liveOnly':'true'},{**H,'Cache-Control':'no-cache'})
          ev=[]
          def bev(o):
              if isinstance(o,dict):
                  if isinstance(o.get('displayGroups'),list) and o.get('description'):ev.append(o)
                  for x in o.values():bev(x)
              elif isinstance(o,list):
                  for x in o:bev(x)
          bev(b); print('LIVE_EVENTS',len(ev))
          for e in ev[:6]:
              totals=[]
              for dg in e.get('displayGroups') or []:
                  for m in dg.get('markets') or []:
                      if 'total' not in str(m.get('description','')).lower():continue
                      for o in m.get('outcomes') or []:
                          if str(o.get('description','')).lower().startswith('over'):
                              p=o.get('price') or {}; totals.append((p.get('handicap'),p.get('decimal'),o.get('description')))
              print('EVENT',e.get('id'),e.get('description'),'TOTALS',totals[:10])
          print('\n=== KAMBI/BETRIVERS ===')
          listurl='https://eu-offering-api.kambicdn.com/offering/v2018/rsiusnj/listView/football/all/all/all/matches.json'
          kd=req(listurl,{'lang':'en_US','market':'US'}); live=[]
          for w in (kd or {}).get('events') or []:
              e=w.get('event') or w; st=str(e.get('state') or '').upper()
              if e.get('homeName') and e.get('awayName') and st not in ('','NOT_STARTED','ENDED','FINISHED','CANCELLED'):live.append(e)
          print('LIVE_EVENTS',len(live))
          for e in live[:5]:
              eid=e.get('id'); print('EVENT',eid,e.get('homeName'),'-',e.get('awayName'),'STATE',e.get('state'))
              off=req(f'https://eu-offering-api.kambicdn.com/offering/v2018/rsiusnj/betoffer/event/{eid}.json',{'lang':'en_US','market':'US','includeParticipants':'true'}); rows=[]
              for bo in (off or {}).get('betOffers') or []:
                  key=(str((bo.get('betOfferType') or {}).get('name') or '')+' '+str((bo.get('criterion') or {}).get('label') or '')).lower()
                  if not any(x in key for x in ('over/under','total goals','asian total')) or any(x in key for x in ('corner','card','shot')):continue
                  for o in bo.get('outcomes') or []:
                      if o.get('status')!='OPEN':continue
                      if 'over' not in str(o.get('label') or '').lower() and str(o.get('type'))!='OT_OVER':continue
                      try: rows.append((float(o.get('line'))/1000,float(o.get('odds'))/1000,key[:80]))
                      except: pass
              print('TOTALS',rows[:12])
          print('\n=== SPORTSBET ===')
          base='https://www.sportsbet.com.au/apigw/sportsbook-sports/Sportsbook/Sports'; sh={**H,'Referer':'https://www.sportsbet.com.au/betting/soccer','country-code':'AU','brand':'sportsbet'}
          sd=req(base,headers=sh)
          if isinstance(sd,list): print('SPORTS_COUNT',len(sd),'SPORTS_SAMPLE',[(x.get('id'),x.get('name')) for x in sd[:30] if isinstance(x,dict)])
          elif isinstance(sd,dict): print('SPORT_KEYS',list(sd)[:40])
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add odds_sources_probe.txt
          git commit -m 'Store one-shot free odds source probe' || exit 0
          git push
