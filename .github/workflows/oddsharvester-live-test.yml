name: OddsHarvester LIVE isolated test

on:
  push:
    branches:
      - test/oddsharvester-live
  workflow_dispatch:

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OddsHarvester
        run: |
          python -m pip install --upgrade pip
          pip install oddsharvester
          python -m playwright install --with-deps chromium

      - name: Discover real LIVE football matches
        run: |
          oddsharvester live -s football --links-only -f json -o live_links.json --headless
          echo '=== LIVE LINKS ==='
          cat live_links.json

      - name: Select one real LIVE match
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('live_links.json')
          data=json.loads(p.read_text())
          rows=data if isinstance(data,list) else data.get('data',[]) if isinstance(data,dict) else []
          if not rows:
              print('NO_LIVE_MATCHES')
              pathlib.Path('selected_match.txt').write_text('NO_LIVE_MATCHES')
              raise SystemExit(0)
          row=rows[0]
          url=row.get('match_url') or row.get('url') or ''
          pathlib.Path('selected_match.txt').write_text(json.dumps(row,ensure_ascii=False,indent=2))
          print('SELECTED',json.dumps(row,ensure_ascii=False))
          if url:
              with open(os.environ['GITHUB_ENV'],'a') as f:
                  f.write(f'MATCH_URL={url}\n')
          PY

      - name: Scrape selected LIVE match Over Under markets
        if: env.MATCH_URL != ''
        continue-on-error: true
        run: |
          echo "Scraping $MATCH_URL"
          oddsharvester live -s football --match-link "$MATCH_URL" -m over_under -f json -o live_odds.json --headless --concurrency 1 --request-delay 1
          echo '=== LIVE ODDS OUTPUT ==='
          test -f live_odds.json && cat live_odds.json || true

      - name: Summarize captured totals
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          print('\n=== SELECTED MATCH ===')
          p=pathlib.Path('selected_match.txt')
          print(p.read_text() if p.exists() else 'NO SELECTED MATCH FILE')
          print('\n=== LIVE TOTALS ===')
          p=pathlib.Path('live_odds.json')
          if not p.exists():
              print('NO LIVE ODDS FILE')
              raise SystemExit(0)
          data=json.loads(p.read_text())
          rows=data if isinstance(data,list) else data.get('data',[]) if isinstance(data,dict) else []
          print('ROWS',len(rows))
          for r in rows:
              if isinstance(r,dict):
                  print(json.dumps(r,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oddsharvester-live-test
          path: |
            live_links.json
            selected_match.txt
            live_odds.json
          if-no-files-found: ignore
