name: one-shot-btts-1h
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-btts-1h.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests -q
      - name: Probe BTTS and first-half goal markets
        run: |
          python - <<'PY' > btts_1h_probe.txt
          import requests,json,re
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137 Safari/537.36','Accept':'application/json,text/plain,*/*'}
          def req(url,params=None,headers=None):
              try:
                  r=requests.get(url,params=params,headers=headers or H,timeout=20,allow_redirects=True)
                  print('HTTP',r.status_code,'URL',r.url,'LEN',len(r.content))
                  if r.status_code==200:
                      try:return r.json()
                      except: print('NONJSON',r.text[:200])
              except Exception as e: print('ERR',type(e).__name__,e)
              return None

          print('=== BOVADA ===')
          b=req('https://www.bovada.lv/services/sports/event/v2/events/A/description/soccer',{'lang':'en','liveOnly':'true'},{**H,'Cache-Control':'no-cache'})
          ev=[]
          def walk(o):
              if isinstance(o,dict):
                  if isinstance(o.get('displayGroups'),list) and o.get('description'):ev.append(o)
                  for v in o.values():walk(v)
              elif isinstance(o,list):
                  for v in o:walk(v)
          walk(b)
          print('LIVE_EVENTS',len(ev))
          for e in ev[:15]:
              btts=[]; first=[]
              for dg in e.get('displayGroups') or []:
                  for m in dg.get('markets') or []:
                      md=str(m.get('description') or '').lower(); gd=str(dg.get('description') or '').lower()
                      for o in m.get('outcomes') or []:
                          od=str(o.get('description') or '').lower(); p=o.get('price') or {}
                          dec=p.get('decimal'); line=p.get('handicap')
                          text=' '.join((gd,md,od))
                          if any(x in text for x in ('both teams to score','both teams score','btts')) and any(x in od for x in ('yes','both')):
                              btts.append((dec,m.get('description'),o.get('description')))
                          if ('1st half' in text or 'first half' in text or 'l1h' in od) and 'total' in md and od.startswith('over'):
                              first.append((line,dec,m.get('description'),o.get('description')))
              if btts or first:
                  print('EVENT',e.get('id'),e.get('description'),'BTTS',btts[:8],'FIRST_HALF',first[:10])

          print('\n=== KAMBI ===')
          base='https://eu-offering-api.kambicdn.com/offering/v2018/rsiusnj'
          kd=req(base+'/listView/football/all/all/all/matches.json',{'lang':'en_US','market':'US'})
          live=[]
          for w in (kd or {}).get('events') or []:
              e=w.get('event') or w; st=str(e.get('state') or '').upper()
              if e.get('homeName') and e.get('awayName') and st not in ('','NOT_STARTED','ENDED','FINISHED','CANCELLED'):live.append(e)
          print('LIVE_EVENTS',len(live))
          for e in live[:12]:
              eid=e.get('id'); off=req(base+f'/betoffer/event/{eid}.json',{'lang':'en_US','market':'US','includeParticipants':'true'})
              btts=[]; first=[]
              for bo in (off or {}).get('betOffers') or []:
                  tn=str((bo.get('betOfferType') or {}).get('name') or ''); cr=str((bo.get('criterion') or {}).get('label') or ''); key=(tn+' '+cr).lower()
                  for o in bo.get('outcomes') or []:
                      if o.get('status')!='OPEN': continue
                      label=str(o.get('label') or '').lower(); typ=str(o.get('type') or '')
                      try:odd=float(o.get('odds'))/1000
                      except:continue
                      if any(x in key for x in ('both teams to score','both teams score','both teams will score')) and ('yes' in label or typ in ('OT_YES','YES')):
                          btts.append((odd,tn,cr,o.get('label'),typ))
                      if ('1st half' in key or 'first half' in key) and any(x in key for x in ('over/under','total goals')) and ('over' in label or typ=='OT_OVER'):
                          try:line=float(o.get('line'))/1000
                          except:line=None
                          first.append((line,odd,tn,cr,o.get('label'),typ))
              if btts or first:
                  print('EVENT',eid,e.get('homeName'),'-',e.get('awayName'),'STATE',e.get('state'),'BTTS',btts[:8],'FIRST_HALF',first[:10])
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add btts_1h_probe.txt
          git commit -m 'Store BTTS and first-half live odds probe' || exit 0
          git push
