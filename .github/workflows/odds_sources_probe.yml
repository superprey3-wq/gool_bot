name: Odds Sources Probe

on:
  workflow_dispatch:
    inputs:
      home:
        description: Home team
        required: false
        default: Real Madrid
      away:
        description: Away team
        required: false
        default: Real Sociedad
  push:
    branches:
      - live-only-quant-foundation

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-only-quant-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: pip install requests
      - name: Audit exact live feed payload
        env:
          HOME_TEAM: ${{ github.event.inputs.home || 'Real Madrid' }}
          AWAY_TEAM: ${{ github.event.inputs.away || 'Real Sociedad' }}
        run: |
          python - <<'PY'
          import os, requests, collections
          home=(os.getenv('HOME_TEAM') or 'Real Madrid').strip().lower()
          away=(os.getenv('AWAY_TEAM') or 'Real Sociedad').strip().lower()
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Accept-Language':'en-US,en;q=0.9','Referer':'https://1xbet.fi/','Origin':'https://1xbet.fi'}
          root='https://1xbet.fi/service-api/LiveFeed'
          params={'sports':1,'count':1000,'lng':'en','mode':4,'country':1,'getEmpty':'true'}
          r=requests.get(root+'/Get1x2_VZip',params=params,headers=H,timeout=20)
          print('HTTP',r.status_code,'bytes',len(r.content)); r.raise_for_status()
          data=r.json(); events=data.get('Value') or []
          print('EVENTS',len(events))
          print('TOP_LEVEL_KEYS', sorted(set().union(*(e.keys() for e in events))) if events else [])
          stats=collections.Counter(); market_types=collections.Counter(); market_groups=collections.Counter(); periods=collections.Counter()
          named=[]
          for e in events:
              sc=e.get('SC') or {}
              periods[str(sc.get('CPS') or sc.get('CP') or '')]+=1
              for block in sc.get('ST') or []:
                  for s in (block.get('Value') or []):
                      stats[s.get('N')]+=1
              for x in (e.get('E') or []):
                  market_types[str(x.get('T'))]+=1; market_groups[str(x.get('G'))]+=1
              for a in (e.get('AE') or []):
                  for x in (a.get('ME') or []):
                      market_types[str(x.get('T'))]+=1; market_groups[str(x.get('G'))]+=1
              text=' '.join(str(e.get(k,'')) for k in ['O1','O2','L','LE','N']).lower()
              if home in text or away in text:
                  named.append(e)
          print('STAT_NAMES',sorted((k,v) for k,v in stats.items() if k))
          print('PERIOD_VALUES',periods.most_common())
          print('MARKET_TYPE_IDS',market_types.most_common())
          print('MARKET_GROUP_IDS',market_groups.most_common())
          print('TARGET_MATCHES',len(named))
          for e in named[:5]:
              print('TARGET_EVENT_CORE',{k:e.get(k) for k in ['I','O1','O2','L','LE','N','S','S1','S2','S3','DI','U','T','CO'] if k in e})
              print('TARGET_SC',e.get('SC'))
              print('TARGET_E',e.get('E'))
              print('TARGET_AE',e.get('AE'))
          # Explicit capability checks: only mark fields proven by payload labels/shape.
          wanted_stats=['xG','Attacks','Dangerous attacks','Possession %','Shots on target','Shots off target','Yellow cards','Red card','Corner','Saves','Penalty','Substitutions','Key Passes','Passing Accuracy %','Crosses']
          names=set(k for k in stats if k)
          print('CAPABILITY_STATS',{x:(x in names) for x in wanted_stats})
          print('HAS_LIVE_SCORE', any((e.get('SC') or {}).get('FS') for e in events))
          print('HAS_PERIOD_SPLIT', any((e.get('SC') or {}).get('PS') for e in events))
          print('HAS_MARKET_ODDS', any(e.get('E') or e.get('AE') for e in events))
          print('HAS_TEAM_NAMES', any(e.get('O1') and e.get('O2') for e in events))
          PY
