name: Odds Sources Probe

on:
  workflow_dispatch:
    inputs:
      home:
        description: Home team
        required: false
        default: Real Madrid
      away:
        description: Away team
        required: false
        default: Real Sociedad
  push:
    branches:
      - live-only-quant-foundation

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-only-quant-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: pip install requests
      - name: Probe odds sources
        env:
          HOME_TEAM: ${{ github.event.inputs.home || 'Real Madrid' }}
          AWAY_TEAM: ${{ github.event.inputs.away || 'Real Sociedad' }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          home=(os.getenv('HOME_TEAM') or 'Real Madrid').strip()
          away=(os.getenv('AWAY_TEAM') or 'Real Sociedad').strip()
          print(f'TARGET: {home} — {away}')
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'}
          def get(label,url,params=None,headers=None):
              try:
                  r=requests.get(url,params=params,headers=headers or H,timeout=15)
                  print(f'\n[{label}] HTTP {r.status_code} type={r.headers.get("content-type","")} bytes={len(r.content)}')
                  print(r.text[:1800].replace('\n',' '))
                  return r
              except Exception as e:
                  print(f'\n[{label}] ERROR {type(e).__name__}: {e}')
                  return None

          common={'sports':1,'count':1000,'lng':'en','mode':4,'country':1,'getEmpty':'true'}
          for root in ('https://1xbet.com/LiveFeed','https://1xbet.fi/LiveFeed'):
              get('1XBET '+root,root+'/Get1x2_VZip',common,{**H,'Referer':'https://1xbet.com/'})
          for root in ('https://melbet.com/LiveFeed','https://melbet.org/LiveFeed'):
              get('MELBET '+root,root+'/Get1x2_VZip',common,{**H,'Referer':'https://melbet.com/'})

          # Flashscore/LSApp direct reachability + today's market payload for a known event when available.
          get('LSAPP HEALTH','https://global.ds.lsapp.eu/odds/pq_graphql',{
              '_hash':'oce','eventId':'','projectId':'5','geoIpCode':'US','geoIpSubdivisionCode':'USCA'
          },{**H,'Referer':'https://www.flashscore.com/'})

          key=(os.getenv('GOAL_API_KEY') or '').strip()
          if key:
              gh={**H,'Authorization':f'Bearer {key}','X-API-Key':key}
              for url in (
                  'https://api.goal-api.com/v1/fixtures/date/2026-08-26',
                  'https://api.goal-api.com/v1/odds/bookmakers',
              ):
                  get('GOAL API',url,headers=gh)
          else:
              print('\n[GOAL API] SKIP: GOAL_API_KEY secret is not configured in GitHub Actions')
          PY
