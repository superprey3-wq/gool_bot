name: Odds Sources Probe

on:
  workflow_dispatch:
    inputs:
      home:
        description: Home team
        required: false
        default: Real Madrid
      away:
        description: Away team
        required: false
        default: Real Sociedad
  push:
    branches:
      - live-only-quant-foundation

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-only-quant-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: pip install requests
      - name: Probe odds sources
        env:
          HOME_TEAM: ${{ github.event.inputs.home || 'Real Madrid' }}
          AWAY_TEAM: ${{ github.event.inputs.away || 'Real Sociedad' }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          home=(os.getenv('HOME_TEAM') or 'Real Madrid').strip()
          away=(os.getenv('AWAY_TEAM') or 'Real Sociedad').strip()
          print(f'TARGET: {home} — {away}')
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Accept-Language':'en-US,en;q=0.9'}
          def get(label,url,params=None,headers=None):
              try:
                  r=requests.get(url,params=params,headers=headers or H,timeout=15,allow_redirects=True)
                  print(f'\n[{label}] HTTP {r.status_code} type={r.headers.get("content-type","")} bytes={len(r.content)}')
                  print(r.text[:1800].replace('\n',' '))
                  return r
              except Exception as e:
                  print(f'\n[{label}] ERROR {type(e).__name__}: {e}')
                  return None

          param_sets=[
              {'sports':1,'count':1000,'lng':'en','mode':4,'country':1,'getEmpty':'true'},
              {'sports':1,'count':1000,'lng':'en','mode':4,'country':137,'gr':285,'virtualSports':'true','noFilterBlockEvent':'true','getEmpty':'true'},
          ]
          roots=[
              ('1XBET service','https://1xbet.com/service-api/LiveFeed','https://1xbet.com'),
              ('1XBET FI service','https://1xbet.fi/service-api/LiveFeed','https://1xbet.fi'),
              ('MELBET service','https://melbet.com/service-api/LiveFeed','https://melbet.com'),
              ('1XBET legacy','https://1xbet.com/LiveFeed','https://1xbet.com'),
              ('1XBET FI legacy','https://1xbet.fi/LiveFeed','https://1xbet.fi'),
              ('MELBET legacy','https://melbet.com/LiveFeed','https://melbet.com'),
              ('MELBET ORG legacy','https://melbet.org/LiveFeed','https://melbet.org'),
          ]
          for label,root,origin in roots:
              for i,params in enumerate(param_sets,1):
                  get(f'{label} p{i}',root+'/Get1x2_VZip',params,{**H,'Referer':origin+'/','Origin':origin})

          key=(os.getenv('GOAL_API_KEY') or '').strip()
          if key:
              gh={**H,'Authorization':f'Bearer {key}','X-API-Key':key}
              for url in (
                  'https://api.goal-api.com/v1/fixtures/date/2026-08-26',
                  'https://api.goal-api.com/v1/odds/bookmakers',
              ):
                  get('GOAL API',url,headers=gh)
          else:
              print('\n[GOAL API] SKIP: GOAL_API_KEY secret is not configured in GitHub Actions')
          PY
