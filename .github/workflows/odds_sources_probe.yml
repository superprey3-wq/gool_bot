name: Odds Sources Probe

on:
  workflow_dispatch:
  push:
    branches:
      - live-only-quant-foundation

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-only-quant-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: pip install requests
      - name: Probe default pregame feed for Aug 27
        run: |
          python - <<'PY'
          import requests, datetime, collections
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Accept-Language':'en-US,en;q=0.9','Referer':'https://1xbet.fi/','Origin':'https://1xbet.fi'}
          URL='https://1xbet.fi/service-api/LineFeed/Get1x2_VZip'
          def call(params):
              r=requests.get(URL,params=params,headers=H,timeout=20)
              print('HTTP',r.status_code,'bytes',len(r.content),'params',params)
              if r.status_code!=200:
                  print(r.text[:300]); return []
              return (r.json().get('Value') or [])
          def dt(e):
              s=e.get('S')
              return datetime.datetime.fromtimestamp(s,datetime.timezone.utc) if isinstance(s,(int,float)) else None
          def richness(e): return len(e.get('E') or [])+sum(len(x.get('ME') or []) for x in (e.get('AE') or []))
          variants=[
              {'sports':1,'count':1000,'lng':'en','mode':4,'country':1,'getEmpty':'true'},
              {'sports':1,'count':500,'lng':'en','mode':4,'country':1,'getEmpty':'true','tz':3},
              {'sports':1,'count':1000,'lng':'en','mode':4,'country':1,'getEmpty':'true','tz':3},
          ]
          target=datetime.date(2026,8,27)
          for p in variants:
              ev=call(p)
              dates=collections.Counter(str(dt(e).date()) for e in ev if dt(e))
              print('COUNT',len(ev),'DATES',dates.most_common())
              c=[e for e in ev if dt(e) and dt(e).date()==target]
              print('AUG27_COUNT',len(c))
              for e in sorted(c,key=richness,reverse=True)[:5]:
                  print('AUG27',e.get('O1'),'—',e.get('O2'),'|',e.get('L'),'|',dt(e),'| ID',e.get('I'),'| markets',richness(e))
                  print('E',e.get('E')); print('AE',e.get('AE'))
              if c: break
          PY
