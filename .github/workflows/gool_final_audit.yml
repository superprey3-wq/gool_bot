name: GOOL final audit
on:
  push:
    paths:
      - '.github/workflows/gool_final_audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-only-quant-foundation
      - name: Compile
        run: python -m compileall -q main.py gool_bot
      - name: Install runtime deps
        run: pip install -q -r gool_bot/requirements.txt
      - name: Import smoke
        run: |
          cd gool_bot
          python -c "import main; print('IMPORT_OK')"
      - name: Market settlement tests
        run: |
          cd gool_bot
          python - <<'PY'
          from market_settlement import fully_won_now, settle_primary
          cases=[
            ({'market_type':'BTTS','odd':2.0},'1:1',True),
            ({'market_type':'BTTS','odd':2.0},'1:0',False),
            ({'market_type':'TEAM_TOTAL_HOME','line':0.5,'odd':1.8},'1:0',True),
            ({'market_type':'TEAM_TOTAL_HOME','line':1.5,'odd':1.8},'1:0',False),
            ({'market_type':'TEAM_TOTAL_AWAY','line':0.5,'odd':1.9},'0:1',True),
            ({'market_type':'TOTAL','line':2.5,'odd':1.9},'2:1',True),
            ({'market_type':'TOTAL','line':2.5,'odd':1.9},'1:1',False),
          ]
          for p,s,w in cases:
            got=fully_won_now(p,s)
            assert got==w,(p,s,got,w)
          assert settle_primary({'market_type':'BTTS','odd':2.0},'1:1')['result']=='+'
          assert settle_primary({'market_type':'TEAM_TOTAL_HOME','line':0.5,'odd':1.8},'1:0')['result']=='+'
          assert settle_primary({'market_type':'TEAM_TOTAL_AWAY','line':0.5,'odd':1.9},'0:1')['result']=='+'
          assert settle_primary({'market_type':'TOTAL','line':2.5,'odd':1.9},'2:1')['result']=='+'
          print('SETTLEMENT_OK')
          PY
      - name: Legacy grep
        run: |
          ! grep -RniE 'HT_HUNTER|LATE_RISK|1xBet|Gemini|playwright' gool_bot --include='*.py'
          echo LEGACY_GREP_OK
      - name: Final marker
        run: echo GOOL_FINAL_AUDIT_OK
