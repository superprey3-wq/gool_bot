name: GOOL final audit
on:
  push:
    paths:
      - '.github/workflows/gool_final_audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-only-quant-foundation
      - name: Compile
        run: python -m compileall -q main.py gool_bot
      - name: Install requirements
        run: pip install -q -r gool_bot/requirements.txt
      - name: Import smoke
        run: |
          cd gool_bot
          python -c "import main; print('IMPORT_OK')"
      - name: Legacy scan
        run: |
          ! grep -RniE 'HT_HUNTER|LATE_RISK|Gemini|playwright|prematch_scanner|1xBet' gool_bot --include='*.py'
      - name: Strategy markers
        run: |
          grep -R "FIRST_HALF_GOAL" gool_bot/multi_engine.py gool_bot/multi_engine_runtime.py
          grep -R "SECOND_HALF_OVER15" gool_bot/multi_engine.py gool_bot/multi_engine_runtime.py
          grep -R "TEAM_TOTAL" gool_bot/team_total_sources_patch.py gool_bot/best_market_selector_patch.py
      - name: Done
        run: echo FINAL_AUDIT_OK
# rerun after legacy cleanup
