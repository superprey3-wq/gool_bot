name: GOOL branch audit
on:
  push:
    branches: [live-only-quant-foundation]
    paths: ['.github/workflows/gool_branch_audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-only-quant-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r gool_bot/requirements.txt
      - name: Compile all
        run: python -m compileall -q gool_bot
      - name: Import production
        run: cd gool_bot && python -c "import main; print('IMPORT_OK')"
      - name: Movement unit smoke
        run: |
          cd gool_bot
          python - <<'PY'
          import market_movement
          rows=[
            {'market_type':'TOTAL','source_prices':[{'movement':{'direction':'toward','drop_pct':6.0}},{'movement':{'direction':'toward','drop_pct':4.0}}]},
            {'market_type':'BTTS','source_prices':[{'movement':{'direction':'toward','drop_pct':3.0}}]},
          ]
          market_movement.annotate(rows)
          assert rows[0]['movement_status']=='CONFIRMED_STEAM'
          assert rows[0]['correlated_steam'] is True
          assert rows[1]['correlated_steam'] is True
          print('MOVEMENT_OK',rows)
          PY
      - name: Optional SGO no-key smoke
        run: cd gool_bot && python -c "import sportsgameodds_provider as s; assert not s.enabled(); assert s.rows('A','B')==[]; print('SGO_NO_KEY_OK')"
      - name: Legacy dependency scan
        run: |
          ! grep -RniE 'playwright|selenium|gemini|xbet' gool_bot --include='*.py' || exit 1
