name: SofaScore probe
on:
  push:
    branches: [live-only-quant-foundation]
    paths: ['.github/workflows/sofascore_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q curl_cffi
      - name: Probe live football and one event
        run: |
          python - <<'PY'
          import json
          from curl_cffi import requests
          B='https://www.sofascore.com/api/v1'
          H={'accept':'*/*','referer':'https://www.sofascore.com/','user-agent':'Mozilla/5.0'}
          def get(path):
            r=requests.get(B+path,headers=H,impersonate='chrome',timeout=15)
            print('HTTP',r.status_code,path,'bytes',len(r.content))
            try:return r.json()
            except Exception:
              print(r.text[:300]);return {}
          live=get('/sport/football/events/live')
          evs=live.get('events') or []
          print('LIVE_EVENTS',len(evs))
          if not evs: raise SystemExit(2)
          # prefer a normal senior match with status in progress
          e=evs[0]
          for x in evs:
            if x.get('homeTeam',{}).get('name') and x.get('awayTeam',{}).get('name'):
              e=x;break
          eid=e['id'];print('EVENT',eid,e.get('homeTeam',{}).get('name'),'vs',e.get('awayTeam',{}).get('name'),e.get('status'))
          paths=[f'/event/{eid}',f'/event/{eid}/statistics',f'/event/{eid}/incidents',f'/event/{eid}/graph',f'/event/{eid}/lineups',f'/event/{eid}/team-streaks',f'/event/{eid}/h2h/0/events',f'/event/{eid}/odds/1/all']
          for p in paths:
            d=get(p)
            if isinstance(d,dict):
              print('KEYS',p,list(d)[:30])
              if 'markets' in d:
                print('MARKETS',len(d.get('markets') or []))
                for m in (d.get('markets') or [])[:12]: print('MKT',m.get('marketName') or m.get('name'),[(c.get('name'),c.get('decimalValue'),c.get('fractionalValue')) for c in (m.get('choices') or [])[:6]])
              if p.endswith('/statistics'):
                print('STATS_SAMPLE',json.dumps(d,ensure_ascii=False)[:2500])
              if p.endswith('/team-streaks'):
                print('STREAK_SAMPLE',json.dumps(d,ensure_ascii=False)[:1800])
          PY
