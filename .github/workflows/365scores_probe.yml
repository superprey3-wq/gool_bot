name: 365Scores probe
on:
  push:
    paths:
      - '.github/workflows/365scores_probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - name: Probe 365Scores Cardiff Norwich
        run: |
          python - <<'PY'
          import requests, json, re
          H={'User-Agent':'Mozilla/5.0','Accept':'*/*','Referer':'https://www.365scores.com/'}
          base='https://webws.365scores.com/web'
          def get(path,params):
              r=requests.get(base+'/'+path.lstrip('/'),params=params,headers=H,timeout=20)
              print('\nURL',r.url,'STATUS',r.status_code)
              r.raise_for_status(); return r.json()
          data=get('games/',{'appTypeId':5,'langId':1,'timezoneName':'Etc/UTC','sports':1})
          games=data.get('games') or []
          print('GAMES',len(games))
          target=None
          for g in games:
              h=((g.get('homeCompetitor') or {}).get('name') or '')
              a=((g.get('awayCompetitor') or {}).get('name') or '')
              if ('cardiff' in h.lower() and 'norwich' in a.lower()) or ('norwich' in h.lower() and 'cardiff' in a.lower()):
                  target=g;break
          if not target:
              print('TARGET_NOT_FOUND')
              for g in games[:100]:
                  h=((g.get('homeCompetitor') or {}).get('name') or '')
                  a=((g.get('awayCompetitor') or {}).get('name') or '')
                  if 'cardiff' in h.lower()+a.lower() or 'norwich' in h.lower()+a.lower():print('CANDIDATE',g.get('id'),h,a)
              raise SystemExit(0)
          gid=target.get('id');print('TARGET',gid,(target.get('homeCompetitor') or {}).get('name'),'vs',(target.get('awayCompetitor') or {}).get('name'))
          print('LIST_KEYS',sorted(target.keys()))
          print('LIST_TARGET',json.dumps(target,ensure_ascii=False)[:12000])
          detail=get('game/',{'appTypeId':5,'langId':1,'timezoneName':'Etc/UTC','gameId':gid,'topBookmaker':14})
          game=detail.get('game') or detail
          print('DETAIL_TOP_KEYS',sorted(detail.keys()) if isinstance(detail,dict) else type(detail).__name__)
          print('GAME_KEYS',sorted(game.keys()) if isinstance(game,dict) else type(game).__name__)
          for k in ['events','chartEvents','statistics','stats','members','lineups','probableLineups','odds','bookmakers','bets','markets','trends','gameTrends','insights','h2h','headToHead','winProbability','predictions']:
              v=game.get(k) if isinstance(game,dict) else None
              if v not in (None,[],{}): print('FIELD',k, json.dumps(v,ensure_ascii=False)[:12000])
          # recursive search for keys related to odds/trends/stats
          found=[]
          def walk(x,path='game'):
              if isinstance(x,dict):
                  for k,v in x.items():
                      p=f'{path}.{k}'
                      if re.search(r'odd|book|bet|market|trend|stat|xg|xgot|lineup|chance|probab|movement',k,re.I):
                          found.append((p,v))
                      walk(v,p)
              elif isinstance(x,list):
                  for i,v in enumerate(x[:200]):walk(v,f'{path}[{i}]')
          walk(game)
          print('MATCHED_PATHS',len(found))
          for p,v in found[:200]:
              try:s=json.dumps(v,ensure_ascii=False)
              except:s=str(v)
              print('PATH',p,'=',s[:1000])
          PY