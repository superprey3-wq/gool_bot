name: Test Live Goal Engine

on:
  push:
    paths:
      - "gool_bot/**"
      - ".github/workflows/test-live-engine.yml"
  workflow_dispatch:

jobs:
  test-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gool_bot/requirements.txt
      - name: Install
        working-directory: gool_bot
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Compile all bot modules
        working-directory: gool_bot
        run: python -m compileall -q .
      - name: Import multi-engine stack
        working-directory: gool_bot
        run: python -c "import multi_engine, multi_engine_card, multi_engine_runtime, core_warmup_patch, multi_engine_report_patch; print('MULTI_ENGINE_IMPORT_OK')"
      - name: Probe feed and locale coverage
        working-directory: gool_bot
        run: python probe_flashscore_feed.py 2>&1 | tee feed_probe.log
      - name: Run one live scan
        working-directory: gool_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_SIGNAL_THRESHOLD: "101"
        run: python -c "import asyncio; from unified_bot import scan_live_once; asyncio.run(scan_live_once())" 2>&1 | tee live_scan.log
      - name: Upload LIVE diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-coverage-log
          path: |
            gool_bot/live_scan.log
            gool_bot/feed_probe.log
          retention-days: 1
