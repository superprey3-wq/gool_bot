name: Final GOOL cards audit
on:
  push:
    branches: [live-only-quant-foundation]
    paths: ['.github/workflows/final_cards_audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -r requirements.txt
      - run: python -m compileall -q gool_bot
      - name: Card import smoke
        working-directory: gool_bot
        run: |
          python - <<'PY'
          import signal_card, multi_engine_card
          assert multi_engine_card._header_text('first_half_goal')[0] == multi_engine_card.PURPLE
          assert multi_engine_card._header_text('second_half_over15')[0] == multi_engine_card.BLUE
          assert 'WIN' in multi_engine_card.render_result_card.__code__.co_consts
          print('FINAL_CARDS_OK')
          PY
