name: GOOL BOT Unified Scanner

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: gool_bot/requirements.txt

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: |
            gool_bot/live_state.json
            gool_bot/live_sent.json
            gool_bot/signal_journal.json
          key: live-state-${{ github.run_id }}
          restore-keys: |
            live-state-

      - name: Install dependencies
        working-directory: gool_bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run PREMATCH scanner
        working-directory: gool_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_MINUTES_TO_KICKOFF: "2"
          MAX_MINUTES_TO_KICKOFF: "9"
          MIN_BOOKMAKERS: "3"
          MIN_CONSENSUS: "0.65"
          MIN_MEDIAN_DROP: "8.0"
          MAX_SIGNALS_PER_MATCH: "4"
        run: python prematch_standard_scanner.py

      - name: Run LIVE scanner
        working-directory: gool_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_SIGNAL_THRESHOLD: "75"
          LIVE_COOLDOWN_MINUTES: "12"
        run: python -c "import asyncio; from unified_bot import scan_live_once; asyncio.run(scan_live_once())"
