name: goal-api-probe
on:
  push:
    branches: [live-only-quant-foundation]
    paths: ['.github/workflows/goal-api-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe GOAL API live odds and stats
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          key=os.environ.get('GOAL_API_KEY','')
          if not key:
              raise SystemExit('GOAL_API_KEY secret missing')
          base='https://api.goal-api.com/v1'
          H={'Authorization':f'Bearer {key}','Accept':'application/json','User-Agent':'GOOL-probe/1.0'}
          def get(path):
              req=urllib.request.Request(base+path,headers=H)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status, json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','ignore')
                  return e.code, {'error_body':body[:1000]}
              except Exception as e:
                  return 0, {'error':repr(e)}
          code,data=get('/fixtures/live')
          print('LIVE_HTTP',code)
          if code!=200:
              print(json.dumps(data,ensure_ascii=False)[:4000]); raise SystemExit(1)
          rows=data.get('data') or []
          print('LIVE_COUNT',len(rows))
          for i,m in enumerate(rows[:30]):
              hid=m.get('id') or m.get('fixtureId') or m.get('matchId')
              home=(m.get('homeTeam') or {}).get('name') or m.get('homeTeamName') or m.get('home')
              away=(m.get('awayTeam') or {}).get('name') or m.get('awayTeamName') or m.get('away')
              league=(m.get('league') or {}).get('name') if isinstance(m.get('league'),dict) else m.get('leagueName') or m.get('competitionName')
              minute=m.get('minute') or m.get('elapsed')
              hs=(m.get('homeTeam') or {}).get('score') if isinstance(m.get('homeTeam'),dict) else m.get('homeScore')
              aw=(m.get('awayTeam') or {}).get('score') if isinstance(m.get('awayTeam'),dict) else m.get('awayScore')
              print(f'LIVE {i+1:02d}',hid,league,home,'-',away,'min',minute,'score',hs,aw)
          targets=rows[:8]
          std={'0.5','1.5','2.0','2','2.5','3.0','3','3.5'}
          for m in targets:
              fid=m.get('id') or m.get('fixtureId') or m.get('matchId')
              if not fid: continue
              home=(m.get('homeTeam') or {}).get('name') or m.get('homeTeamName') or '?'
              away=(m.get('awayTeam') or {}).get('name') or m.get('awayTeamName') or '?'
              print('\nMATCH',fid,home,'-',away)
              sc,stats=get(f'/fixtures/{fid}/statistics')
              print('STATS_HTTP',sc)
              if sc==200:
                  sd=stats.get('data')
                  blob=json.dumps(sd,ensure_ascii=False)
                  print('STATS_SAMPLE',blob[:5000])
              else:
                  print('STATS_ERR',json.dumps(stats,ensure_ascii=False)[:1200])
              oc,odds=get(f'/fixtures/{fid}/live-odds')
              print('ODDS_HTTP',oc)
              if oc!=200:
                  print('ODDS_ERR',json.dumps(odds,ensure_ascii=False)[:1200]); continue
              od=odds.get('data') or []
              if isinstance(od,dict):
                  candidates=[]
                  for k,v in od.items():
                      if isinstance(v,list): candidates.extend(v)
                  if not candidates: candidates=[od]
              elif isinstance(od,list): candidates=od
              else: candidates=[]
              print('BOOK_ROWS',len(candidates))
              found=[]
              for row in candidates:
                  if not isinstance(row,dict): continue
                  book=row.get('bookmaker') or row.get('bookmakerName') or row.get('name') or 'unknown'
                  ou=row.get('overUnder') or row.get('over_under') or row.get('totals') or {}
                  if isinstance(ou,dict):
                      byline={}
                      for k,v in ou.items():
                          ks=str(k)
                          import re
                          mm=re.search(r'(\d+(?:\.\d+)?)',ks)
                          if not mm: continue
                          line=mm.group(1)
                          if line not in std: continue
                          side='OVER' if ks.lower().startswith('o') or 'over' in ks.lower() else 'UNDER' if ks.lower().startswith('u') or 'under' in ks.lower() else ks
                          try: price=float(v)
                          except: continue
                          if price>1: byline.setdefault(line,{})[side]=price
                      for line,sides in byline.items(): found.append((book,line,sides))
              print('STANDARD_TOTALS',json.dumps(found[:40],ensure_ascii=False))
          PY
