name: Test BetRivers Kambi LIVE coverage
on:
  workflow_dispatch:
  push:
    branches: ["test/live-odds-coverage"]
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests playwright curl_cffi
      - name: Compare Flashscore LIVE to BetRivers Kambi
        env:
          PYTHONPATH: gool_bot
        run: |
          python - <<'PY'
          import asyncio,re,unicodedata
          from difflib import SequenceMatcher
          from curl_cffi import requests
          from feed_live_discovery import discover_live_matches

          OP='rsiusnj'
          LIST=f'https://eu-offering-api.kambicdn.com/offering/v2018/{OP}/listView/football/all/all/all/matches.json?lang=en_US&market=US'
          EVENT=f'https://eu-offering-api.kambicdn.com/offering/v2018/{OP}/betoffer/event/{{}}.json?lang=en_US&market=US&includeParticipants=true'

          def norm(s):
              s=unicodedata.normalize('NFKD',str(s or '')).encode('ascii','ignore').decode().lower()
              s=re.sub(r'\b(fc|afc|cf|sc|fk|sv|ac|as|u19|u20|u21|u23|women|eng|ita|ger|den|hun)\b',' ',s)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              return ' '.join(s.split())
          def sim(a,b):
              a,b=norm(a),norm(b)
              if not a or not b:return 0
              if a==b:return 1
              if a in b or b in a:return .92
              return SequenceMatcher(None,a,b).ratio()
          def is_live(ev):
              st=str(ev.get('state','')).upper()
              return st not in ('NOT_STARTED','ENDED','FINISHED','CANCELLED','')
          def open_total_offers(data):
              out=[]
              for bo in data.get('betOffers') or []:
                  bt=str((bo.get('betOfferType') or {}).get('name','')).lower()
                  crit=str((bo.get('criterion') or {}).get('label','')).lower()
                  if not any(k in bt+' '+crit for k in ('over/under','over_under','total goals','total')): continue
                  overs=[]
                  for o in bo.get('outcomes') or []:
                      if o.get('status')!='OPEN': continue
                      label=str(o.get('label','')).lower(); typ=str(o.get('type',''))
                      if 'over' in label or typ=='OT_OVER':
                          try: odd=float(o.get('odds'))/1000
                          except: odd=None
                          line=o.get('line'); line=float(line)/1000 if line is not None else None
                          overs.append((line,odd,crit,bt))
                  if overs: out.extend(overs)
              return out

          flash=asyncio.run(discover_live_matches())
          print('FLASHSCORE_LIVE',len(flash))
          r=requests.get(LIST,impersonate='chrome120',timeout=25)
          print('KAMBI_STATUS',r.status_code,r.text[:200])
          r.raise_for_status(); data=r.json()
          wrappers=data.get('events') or []
          events=[]
          for w in wrappers:
              ev=w.get('event') or w
              if ev.get('homeName') and ev.get('awayName') and is_live(ev): events.append(ev)
          print('KAMBI_LIVE',len(events),'ALL_WRAPPERS',len(wrappers))
          for ev in events[:30]: print('KAMBI',ev.get('state'),ev.get('homeName'),'--',ev.get('awayName'),'id',ev.get('id'))

          matched=[]; misses=[]
          for m in flash:
              best=None
              for ev in events:
                  a,b=ev.get('homeName',''),ev.get('awayName','')
                  score=max((sim(m.home,a)+sim(m.away,b))/2,(sim(m.home,b)+sim(m.away,a))/2)
                  if best is None or score>best[0]: best=(score,ev)
              if best and best[0]>=0.72: matched.append((m,best))
              else: misses.append((m,best))
          print('MATCHED',len(matched),'OF',len(flash),'=',round(100*len(matched)/len(flash),1) if flash else 0,'%')

          with_ou=[]
          for m,(score,ev) in matched:
              try:
                  rr=requests.get(EVENT.format(ev.get('id')),impersonate='chrome120',timeout=15)
                  offers=open_total_offers(rr.json()) if rr.status_code==200 else []
              except Exception as e:
                  print('EVENT_ERR',ev.get('id'),e); offers=[]
              if offers: with_ou.append((m,score,ev,offers))
              print('CHECK',m.home,'--',m.away,'=>',ev.get('homeName'),'--',ev.get('awayName'),'score',round(score,2),'OU',offers[:6])
          print('WITH_OU',len(with_ou),'OF_FS',len(flash),'=',round(100*len(with_ou)/len(flash),1) if flash else 0,'%')
          print('WITH_OU_OF_MATCHED',round(100*len(with_ou)/len(matched),1) if matched else 0,'%')
          print('--- MISSES ---')
          for m,b in misses[:40]:
              ev=b[1] if b else None
              print('MISS',m.home,'--',m.away,'best',None if not ev else (ev.get('homeName'),ev.get('awayName'),round(b[0],2)))
          PY
