name: Test SStats LIVE coverage
on:
  workflow_dispatch:
  push:
    branches: ["test/live-odds-coverage"]
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install requests playwright
          playwright install --with-deps chromium
      - name: Compare Flashscore LIVE to SStats/PARI
        env:
          PYTHONPATH: gool_bot
          SSTATS_API_KEY: ${{ secrets.SSTATS_API_KEY }}
        run: |
          python - <<'PY'
          import asyncio,json,os,re,requests
          from feed_live_discovery import discover_live_matches
          key=os.getenv('SSTATS_API_KEY','').strip()
          print('SECRET_PRESENT',bool(key),'LEN',len(key))
          headers={'Accept':'application/json','Authorization':f'ApiKey {key}','User-Agent':'GOOL-BOT-SStats-Probe/1.0'}
          flash=asyncio.run(discover_live_matches())
          print('FLASH_LIVE',len(flash))
          for m in flash[:40]: print('FS',m.event_id,m.minute,m.home,'--',m.away,f'{m.home_score}:{m.away_score}')
          def get(path,params=None):
              try:
                  r=requests.get('https://api.sstats.net'+path,headers=headers,params=params,timeout=25)
                  print('HTTP',r.status_code,r.url,'BYTES',len(r.content))
                  try:return r,r.json()
                  except:return r,None
              except Exception as e:
                  print('ERR',path,repr(e)); return None,None
          def arr(x):
              if isinstance(x,list): return x
              if isinstance(x,dict):
                  for k in ('items','data','results','games','matches','events'):
                      v=x.get(k)
                      if isinstance(v,list): return v
                      if isinstance(v,dict):
                          for q in ('items','results','games','matches','events'):
                              if isinstance(v.get(q),list): return v[q]
              return []
          candidates=[('/pari/matches',{'live':'true','includeOdds':'true'}),('/Pari/matches',{'live':'true','includeOdds':'true'}),('/Odds/live-markets',None),('/odds/live-markets',None)]
          pari=[]
          for p,q in candidates:
              r,d=get(p,q)
              its=arr(d)
              print('PROBE',p,'STATUS',None if r is None else r.status_code,'ITEMS',len(its))
              if d is not None: print('PREVIEW',json.dumps(d,ensure_ascii=False)[:2000])
              if 'pari' in p.lower() and len(its)>len(pari): pari=its
          print('PARI_ITEMS',len(pari))
          def val(d,*ks):
              for k in ks:
                  if isinstance(d,dict) and d.get(k) is not None:return d.get(k)
          def nm(v):
              if isinstance(v,dict):return str(v.get('name') or v.get('title') or v.get('shortName') or '')
              return str(v or '')
          def norm(s):return ' '.join(re.sub(r'[^a-z0-9]+',' ',str(s).lower()).split())
          def teams(d):return nm(val(d,'home','homeTeam','team1','host')),nm(val(d,'away','awayTeam','team2','guest'))
          matched=[]
          for m in flash:
              hit=None; why=''
              for d in pari:
                  fid=str(val(d,'flashId','FlashId','flashID','flashscoreId','flashScoreId') or '')
                  if fid==m.event_id: hit=d; why='FlashId'; break
              if hit is None:
                  mh,ma=norm(m.home),norm(m.away)
                  for d in pari:
                      h,a=teams(d); nh,na=norm(h),norm(a)
                      if mh and ma and nh and na and (mh in nh or nh in mh) and (ma in na or na in ma): hit=d; why='names'; break
              if hit is not None:
                  gid=val(hit,'id','gameId','eventId','matchId')
                  matched.append((m,gid,hit,why)); print('MATCH',why,m.event_id,m.home,'--',m.away,'ID',gid)
          print('MATCHED',len(matched),'OF',len(flash),'PCT',round(100*len(matched)/len(flash),1) if flash else 0)
          ou=0
          for m,gid,d,why in matched[:30]:
              if gid is None: continue
              found=False
              for p in (f'/Odds/live/{gid}',f'/odds/live/{gid}',f'/pari/match/{gid}',f'/Pari/match/{gid}'):
                  r,x=get(p)
                  if r is None or r.status_code!=200 or x is None: continue
                  txt=json.dumps(x,ensure_ascii=False)
                  has=bool(re.search(r'over|under|total|тотал',txt,re.I))
                  print('ODDS',m.event_id,p,'OU',has,'PREVIEW',txt[:1800])
                  if has: found=True; break
              if found: ou+=1
          print('LIVE_OU',ou,'OF_MATCHED',len(matched),'OF_FLASH',len(flash))
          PY
