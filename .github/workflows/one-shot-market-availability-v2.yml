name: one-shot-market-availability-v2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -q
      - name: Verify source hierarchy imports
        working-directory: gool_bot
        run: |
          python - <<'PY'
          import live_odds
          import kambi_live_odds
          import sportsgameodds_provider
          import aux_strategy_markets
          import period_market_patch
          import multi_source_odds_patch
          print('PRIMARY=Flashscore/LSApp')
          print('CONFIRMATION=Kambi/BetRivers, SportsGameOdds(optional)')
          print('BOVADA=disabled')
          print('Source hierarchy imports OK')
          PY
