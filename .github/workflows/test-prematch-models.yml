name: Test prematch prediction models

on:
  push:
    branches: ["test/prematch-prediction-models"]
  workflow_dispatch:

jobs:
  reymes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Clone Reymes predictor
        run: git clone --depth 1 https://github.com/Reymes/football-match-prediction.git /tmp/reymes
      - name: Install
        working-directory: /tmp/reymes
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Train and capture
        working-directory: /tmp/reymes
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/train.py --out artifacts 2>&1 | tee /tmp/reymes-train.log
      - name: Predict if bundle exists
        working-directory: /tmp/reymes
        continue-on-error: true
        run: |
          if [ -f artifacts/models.joblib ]; then
            python scripts/predict_upcoming.py --artifacts artifacts --json /tmp/reymes_preds.json 2>&1 | tee /tmp/reymes-predict.log
          else
            echo 'NO_BUNDLE' | tee /tmp/reymes-predict.log
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: reymes-test
          path: |
            /tmp/reymes-train.log
            /tmp/reymes-predict.log
            /tmp/reymes_preds.json
          if-no-files-found: ignore

  prophitbet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Clone ProphitBet
        run: git clone --depth 1 https://github.com/kochlisGit/ProphitBet-Soccer-Bets-Predictor.git /tmp/prophit
      - name: Install and capture
        working-directory: /tmp/prophit
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>&1 | tee /tmp/prophit-install.log
      - uses: actions/upload-artifact@v4
        with:
          name: prophitbet-test
          path: /tmp/prophit-install.log
