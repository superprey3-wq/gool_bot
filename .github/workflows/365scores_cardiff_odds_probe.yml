name: 365Scores Cardiff odds probe
on:
  push:
    paths:
      - '.github/workflows/365scores_cardiff_odds_probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - name: Probe Cardiff Norwich 365Scores endpoints
        run: |
          python - <<'PY'
          import requests, json, re
          H={'User-Agent':'Mozilla/5.0','Accept':'*/*','Referer':'https://www.365scores.com/'}
          base='https://webws.365scores.com/web'
          gid=4808212
          common={'appTypeId':5,'langId':1,'timezoneName':'Etc/UTC','userCountryId':-1,'gameId':gid,'games':gid,'topBookmaker':14,'bookmakerId':14}
          probes=[
            ('game/stats/',{'games':gid}),
            ('game/trends/',{'gameId':gid}),
            ('game/toptrends/',{'gameId':gid}),
            ('game/bets/',{'gameId':gid,'topBookmaker':14}),
            ('game/odds/',{'gameId':gid,'topBookmaker':14}),
            ('game/odds/movements/',{'gameId':gid,'topBookmaker':14}),
            ('game/odds/history/',{'gameId':gid,'topBookmaker':14}),
            ('game/bets/movements/',{'gameId':gid,'topBookmaker':14}),
            ('bets/',{'games':gid,'topBookmaker':14}),
            ('odds/',{'games':gid,'topBookmaker':14}),
            ('odds/movements/',{'games':gid,'topBookmaker':14}),
            ('game/predictions/',{'gameId':gid}),
          ]
          def go(path,extra):
              p={k:v for k,v in common.items() if k in ('appTypeId','langId','timezoneName','userCountryId')};p.update(extra)
              try:
                  r=requests.get(base+'/'+path,params=p,headers=H,timeout=15)
                  print('\n===',path,'===',r.status_code,r.url)
                  print('TYPE',r.headers.get('content-type'),'LEN',len(r.content))
                  txt=r.text
                  print(txt[:12000])
                  if r.ok and 'json' in (r.headers.get('content-type') or ''):
                      data=r.json(); hits=[]
                      def walk(x,p='root'):
                          if isinstance(x,dict):
                              for k,v in x.items():
                                  q=p+'.'+k
                                  if re.search(r'odd|price|book|bet|market|line|trend|move|open|min|max|current|probab|xg|xgot|stat',k,re.I): hits.append((q,v))
                                  walk(v,q)
                          elif isinstance(x,list):
                              for i,v in enumerate(x[:300]):walk(v,f'{p}[{i}]')
                      walk(data)
                      print('HITS',len(hits))
                      for q,v in hits[:120]:
                          try:s=json.dumps(v,ensure_ascii=False)
                          except:s=str(v)
                          print('PATH',q,'=',s[:800])
              except Exception as e: print('ERR',path,repr(e))
          for x,y in probes:go(x,y)
          PY