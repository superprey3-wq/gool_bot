name: Bovada integration check
on:
  push:
    branches:
      - test/oddsharvester-live
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync current main integration files
        run: |
          git fetch origin main
          git checkout origin/main -- gool_bot/bovada_live_odds.py gool_bot/live_candidate_patch.py gool_bot/period_market_patch.py gool_bot/signal_card.py gool_bot/unified_bot.py gool_bot/main.py
      - name: Install runtime deps
        run: pip install requests pillow
      - name: Compile integration
        run: |
          python -m py_compile gool_bot/bovada_live_odds.py gool_bot/live_candidate_patch.py gool_bot/period_market_patch.py gool_bot/signal_card.py gool_bot/unified_bot.py gool_bot/main.py
      - name: Verify real Bovada FT and first-half markets
        run: |
          cd gool_bot
          python - <<'PY'
          import bovada_live_odds as b
          events=b._live_events()
          print('LIVE EVENTS',len(events))
          assert events, 'Bovada returned no live soccer events'
          ft_found=0; h1_found=0
          for event in events:
              ft=b._over_prices(event,'FULL_TIME')
              h1=b._over_prices(event,'FIRST_HALF')
              if ft and ft_found<3:
                  print('FT',event.get('description'),sorted(ft.items())[:10]); ft_found+=1
              if h1 and h1_found<3:
                  print('1H',event.get('description'),sorted(h1.items())[:10]); h1_found+=1
              if ft_found>=3 and h1_found>=1: break
          assert ft_found, 'No live FT totals parsed'
          print('FIRST_HALF_EVENTS_FOUND',h1_found)
          PY
      - name: Verify extreme-price rejection
        run: |
          cd gool_bot
          python - <<'PY'
          import live_candidate_patch as p
          assert p._sane_price({'odd':1.80})
          assert not p._sane_price({'odd':9.00})
          assert not p._sane_price({'odd':1.01})
          print('EXTREME PRICE FILTER OK')
          PY
