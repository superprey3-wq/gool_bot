name: Diagnose Arsenal Como live odds
on:
  workflow_dispatch:
  push:
    branches: ["test/prematch-prediction-models"]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe Bovada live soccer
        run: |
          python - <<'PY'
          import requests
          u='https://www.bovada.lv/services/sports/event/v2/events/A/description/soccer?lang=en&liveOnly=true'
          data=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'},timeout=20).json()
          events=[]
          def walk(x):
            if isinstance(x,dict):
              if isinstance(x.get('displayGroups'),list) and x.get('description'): events.append(x)
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(data)
          print('BOVADA_EVENTS',len(events))
          for e in events:
            d=str(e.get('description',''))
            if 'arsenal' in d.lower() or 'como' in d.lower(): print('BOVADA_MATCH',d)
          PY
      - name: Probe Flashscore LSApp live odds
        env:
          PYTHONPATH: gool_bot
        run: |
          python - <<'PY'
          from live_odds import fetch_live_odds
          rows=fetch_live_odds('pCmS9Hj5')
          print('LSAPP_ROWS',len(rows))
          for r in rows:
            print('ROW',r.get('source'),r.get('bettingScope'),r.get('bookmakerId'))
            for o in r.get('odds') or []:
              if str(o.get('selection','')).upper()=='OVER': print('OVER',(o.get('handicap') or {}).get('value'),o.get('value'),o.get('source'))
          PY
