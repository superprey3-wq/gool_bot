name: GOOL BOT Scanner (disabled - external hosting only)

# IMPORTANT:
# The production GOOL bot now runs 24/7 on external hosting.
# Do NOT schedule main.py from GitHub Actions: main.py is an infinite service loop,
# so a */5 cron would create overlapping bot instances that share the same Telegram
# token, duplicate ENTRY/WIN cards, race TRACK state, and compete for getUpdates.

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: External hosting only
        run: |
          echo "GOOL production scanner is disabled in GitHub Actions."
          echo "The bot runs only on the external server."
